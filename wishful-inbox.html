<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wishful.art | suggestions</title>

  <link href="https://fonts.googleapis.com/css2?family=Chela+One&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Chela One", cursive;
      background: linear-gradient(135deg, #0d1117 0%, #1b2634 50%, #0d1117 100%);
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      padding: 25px 0;
      font-size: 40px;
      color: #bcdcff;
      letter-spacing: 1px;
    }

    .container {
      margin: auto;
      width: 60%;
      background: rgba(28, 52, 70, 0.55);
      padding: 60px;
      text-align: center;
      border-radius: 8px;
    }

    .container p {
      font-size: 20px;
      margin-bottom: 30px;
      line-height: 1.4;
    }

    /* NEW: Textbox styling */
    textarea {
      width: 100%;
      height: 180px;
      border-radius: 8px;
      border: none;
      padding: 15px;
      font-size: 20px;
      font-family: "Chela One", cursive;
      background: rgba(255,255,255,0.12);
      color: #ffffff;
      resize: none;
      outline: none;
    }

    /* NEW: Submit button */
    .submit-btn {
      margin-top: 25px;
      background: #b3dbff;
      color: #ffffff;
      border: none;
      padding: 20px 70px;
      font-size: 40px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s ease-in-out;
    }

    .submit-btn:hover {
      background: #c8e5ff;
      transform: scale(1.03);
    }

    footer {
      position: fixed;
      right: 20px;
      bottom: 20px;
      color: #9aa8b8;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>wishful.art</header>

  <div class="container">
    <p>
      Leave Suggestions in the box below or send us an email at<br>
      <strong>(tls91091@email.uccs.edu)</strong>
    </p>

    <!-- NEW: Suggestion Text Box -->
    <textarea id="suggestionBox" placeholder="Type your suggestion here..."></textarea>

    <!-- NEW: Submit Button -->
    <button class="submit-btn" id="submitBtn">Submit</button>
  </div>

  <footer>© 2025 wishful</footer>

  <script>
    document.getElementById("submitBtn").addEventListener("click", function () {
      const text = document.getElementById("suggestionBox").value.trim();

      if (text === "") {
        alert("Please type a suggestion before submitting.");
        return;
      }

      // Save suggestions to localStorage
      const suggestions = JSON.parse(localStorage.getItem("wishful_suggestions") || "[]");
      suggestions.push({
        text: text,
        date: new Date().toLocaleString()
      });

      localStorage.setItem("wishful_suggestions", JSON.stringify(suggestions));

      alert("Suggestion submitted!");

      document.getElementById("suggestionBox").value = "";
    });
  </script>

</body>
</html>
