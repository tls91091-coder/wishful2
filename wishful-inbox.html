<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>wishful.art | suggestions</title>
  <link href="https://fonts.googleapis.com/css2?family=Chela+One&family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header"><div class="inner"><div class="logo">wishful.art</div></div></header>

  <main class="suggestions-page">
    <div class="card suggestions-card">
      <h2>Leave a suggestion</h2>
      <form id="suggestion-form">
        <textarea id="suggestion-text" placeholder="Type your suggestion here..." required></textarea>
        <button class="btn btn-primary" type="submit">Send</button>
      </form>

      <h3>Inbox</h3>
      <ul id="suggestion-list" class="suggestion-list" aria-live="polite"></ul>
    </div>
  </main>

  <footer class="site-footer"><div class="inner"><div class="right-foot">© 2025 wishful</div></div></footer>
  <script src="js/main.js"></script>
</body>
</html>
