<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>wishful.art | contact</title>
  <link href="https://fonts.googleapis.com/css2?family=Chela+One&family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header"><div class="inner"><div class="logo">wishful.art</div></div></header>

  <main class="contact-page">
    <div class="card contact-card">
      <h2>Contact Us</h2>
      <p>If you have questions, concerns or requests, reach out using the form below.</p>

      <form id="contact-form" novalidate>
        <input name="name" type="text" placeholder="Your name" required>
        <input name="email" type="email" placeholder="Your email" required>
        <textarea name="message" placeholder="Your message" required></textarea>
        <button class="btn btn-primary" type="submit">Send</button>
      </form>

      <div id="contact-msg" class="form-msg" aria-live="polite"></div>
    </div>
  </main>

  <footer class="site-footer"><div class="inner"><div class="right-foot">© 2025 wishful</div></div></footer>
  <script src="js/main.js"></script>
</body>
</html>

</body>
</html>
