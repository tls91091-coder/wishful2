<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wishful.art | contact</title>

  <link href="https://fonts.googleapis.com/css2?family=Chela+One&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #0d1117 0%, #1b2634 50%, #0d1117 100%);
      color: white;
      font-family: 'Chela One', cursive;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      padding: 25px 0;
      font-size: 40px;
      color: #bcdcff;
      letter-spacing: 2px;
    }

    .container {
      margin: auto;
      width: 60%;
      background: rgba(28, 52, 70, 0.55);
      padding: 50px;
      text-align: center;
      border-radius: 8px;
    }

    .container h2 {
      font-size: 50px;
      margin-bottom: 20px;
      color: #bcdcff;
    }

    .container p {
      font-size: 20px;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    input, textarea {
      width: 80%;
      padding: 15px;
      font-size: 18px;
      border-radius: 6px;
      margin-bottom: 20px;
      border: 2px solid #b3dbff;
      background: rgba(255, 255, 255, 0.08);
      color: white;
      outline: none;
      font-family: 'Chela One', cursive;
    }

    input:focus, textarea:focus {
      border-color: #d2e8ff;
      box-shadow: 0 0 10px #b3dbff88;
    }

    textarea {
      height: 160px;
      resize: none;
    }

    .send-btn {
      background: #b3dbff;
      padding: 20px 70px;
      color: #ffffff;
      font-size: 40px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }

    .send-btn:hover {
      background: #c8e5ff;
      transform: scale(1.03);
    }

    footer {
      position: fixed;
      bottom: 20px;
      right: 20px;
      color: #9aa8b8;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>wishful.art</header>

<div class="container">
  <h2>Contact Us</h2>
  <p>If you have any questions, concerns, or requests, feel free to reach out below.</p>

  <input type="text" placeholder="Your name">
  <input type="email" placeholder="Your email">
  <textarea placeholder="Your message"></textarea>

  <button class="send-btn">Send</button>
</div>

<footer>© 2025 wishful</footer>

</body>
</html>
